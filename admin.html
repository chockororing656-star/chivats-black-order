<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN – CHIVATS BLACK</title>

<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
h1{text-align:center;color:#f5c04f}
.container{max-width:1200px;margin:auto;padding:16px}
.section{margin-top:30px}
.section h2{color:#f5c04f}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border:1px solid #333;padding:8px;font-size:14px}
th{background:#222}
button{padding:6px 10px;border:none;border-radius:6px;background:#f5c04f;cursor:pointer;margin:2px}
input{width:100%;padding:10px;border-radius:8px;border:none;margin-top:8px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" style="max-width:300px;margin:100px auto;text-align:center">
  <h2>🔐 ADMIN LOGIN</h2>
  <input id="password" type="password" placeholder="รหัสผ่าน">
  <button onclick="login()">เข้าสู่ระบบ</button>
</div>

<!-- ENABLE SOUND -->
<div id="enableSound" style="display:none;text-align:center;margin-top:100px">
  <h2>🔊 เปิดเสียงแจ้งเตือน</h2>
  <button onclick="enableSound()">เปิดเสียง</button>
</div>

<!-- ADMIN -->
<div id="admin" style="display:none">
<div class="container">
<h1>📦 CHIVATS BLACK – ADMIN</h1>

<div class="section"><h2>⏳ ออเดอร์ใหม่</h2>
<table><tbody id="new"></tbody></table></div>

<div class="section"><h2>▶️ รับออเดอร์แล้ว</h2>
<table><tbody id="accepted"></tbody></table></div>

<div class="section"><h2>🍳 กำลังทำ</h2>
<table><tbody id="cooking"></tbody></table></div>

<div class="section"><h2>✅ เสร็จแล้ว</h2>
<table><tbody id="done"></tbody></table></div>

</div>
</div>

<audio id="ding" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ===== LOGIN ===== */
const ADMIN_PASSWORD = "1234"; // 
let soundEnabled = false;

function login(){
  if(password.value === ADMIN_PASSWORD){
    document.getElementById("login").style.display="none";
    document.getElementById("enableSound").style.display="block";
  }else{
    alert("รหัสไม่ถูกต้อง");
  }
}

function enableSound(){
  document.getElementById("enableSound").style.display="none";
  document.getElementById("admin").style.display="block";
  soundEnabled = true;
  startFirebase();
}

/* ===== FIREBASE ===== */
function startFirebase(){
  firebase.initializeApp({
    apiKey: "AIzaSyC03JcyEyEg4iWVKMfgcpDR82EUiFOXMd4",
    authDomain: "chivats-black-order.firebaseapp.com",
    projectId: "chivats-black-order"
  });
  const db = firebase.firestore();

  let firstLoad = true;

  db.collection("orders").orderBy("createdAt","desc")
  .onSnapshot(snap=>{
    ["new","accepted","cooking","done"].forEach(s=>{
      document.getElementById(s).innerHTML="";
    });

    snap.forEach(doc=>{
      const o = doc.data();
      const tr = document.createElement("tr");
      tr.innerHTML = `
<td>${o.createdAt?.toDate().toLocaleString()}</td>
<td>${o.name}</td>
<td>${o.items.map(i=>i.name).join(", ")}</td>
<td>${o.total}฿</td>
<td>
${o.status==="new"?`<button onclick="setStatus('${doc.id}','accepted')">รับ</button>`:""}
${o.status==="accepted"?`<button onclick="setStatus('${doc.id}','cooking')">ทำ</button>`:""}
${o.status==="cooking"?`<button onclick="setStatus('${doc.id}','done')">เสร็จ</button>`:""}
</td>`;
      document.getElementById(o.status||"new").appendChild(tr);
    });

    if(!firstLoad && soundEnabled){
      document.getElementById("ding").play();
    }
    firstLoad=false;
  });

  window.setStatus = (id,status)=>{
    db.collection("orders").doc(id).update({status});
  }
}
</script>

</body>
</html>
