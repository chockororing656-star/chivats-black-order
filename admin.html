<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN – CHIVATS BLACK</title>

<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
h1{text-align:center;color:#f5c04f}
.container{max-width:1200px;margin:auto;padding:16px}

table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{border:1px solid #333;padding:8px;font-size:14px;vertical-align:top}
th{background:#222}
tr.new{background:#1b1b1b}
tr.accepted{background:#24331f}
tr.cooking{background:#332b1f}
tr.done{background:#1f3326}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  background:#f5c04f;
  cursor:pointer;
  margin:2px;
}
</style>
</head>

<body>
<div class="container">
<h1>📦 ออเดอร์ทั้งหมด – CHIVATS BLACK</h1>

<table>
<thead>
<tr>
  <th>เวลา</th>
  <th>ลูกค้า</th>
  <th>รายการ</th>
  <th>ยอด</th>
  <th>ชำระ</th>
  <th>สถานะ</th>
  <th>จัดการ</th>
</tr>
</thead>
<tbody id="orders"></tbody>
</table>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyC03JcyEyEg4iWVKMfgcpDR82EUiFOXMd4",
  authDomain: "chivats-black-order.firebaseapp.com",
  projectId: "chivats-black-order"
});
const db = firebase.firestore();

const statusText = {
  new:"⏳ ใหม่",
  accepted:"▶️ รับแล้ว",
  cooking:"🍳 กำลังทำ",
  done:"✅ เสร็จแล้ว"
};

db.collection("orders")
.orderBy("createdAt","desc")
.onSnapshot(snap=>{
  const tbody = document.getElementById("orders");
  tbody.innerHTML = "";

  snap.forEach(doc=>{
    const o = doc.data();
    const tr = document.createElement("tr");
    tr.className = o.status || "new";

    tr.innerHTML = `
<td>${o.createdAt?.toDate().toLocaleString()}</td>
<td>${o.name}<br>${o.phone}</td>
<td>${o.items.map(i=>`• ${i.name}`).join("<br>")}</td>
<td>${o.total} ฿</td>
<td>${o.payment}</td>
<td>${statusText[o.status]}</td>
<td>
  ${o.status==="new" ? `<button onclick="setStatus('${doc.id}','accepted')">รับ</button>`:""}
  ${o.status==="accepted" ? `<button onclick="setStatus('${doc.id}','cooking')">ทำ</button>`:""}
  ${o.status==="cooking" ? `<button onclick="setStatus('${doc.id}','done')">เสร็จ</button>`:""}
</td>
`;
    tbody.appendChild(tr);
  });
});

function setStatus(id,status){
  db.collection("orders").doc(id).update({status});
}
</script>
</body>
</html>
