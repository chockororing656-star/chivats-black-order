<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN – CHIVATS BLACK</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#111;
  color:#fff;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:16px;
}
h1{color:#f5c04f}

/* LOGIN */
#loginBox{
  max-width:360px;
  margin:80px auto;
  background:#1c1c1c;
  padding:20px;
  border-radius:14px;
}
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
}
button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#f5c04f;
  font-weight:bold;
  cursor:pointer;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px;
}
th,td{
  border-bottom:1px solid #333;
  padding:10px;
  text-align:left;
}
th{color:#f5c04f}
.status{
  font-weight:bold;
}
.new{color:#ff5252}
.accepted{color:#4caf50}

/* ACTIONS */
.actions button{
  margin-right:6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>🔐 Admin Login</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">เข้าสู่ระบบ</button>
</div>

<!-- ADMIN -->
<div class="container" id="adminPanel" style="display:none">
  <h1>📦 ออเดอร์ทั้งหมด – CHIVATS BLACK</h1>

  <table>
    <thead>
      <tr>
        <th>เวลา</th>
        <th>ลูกค้า</th>
        <th>รายการ</th>
        <th>ยอด</th>
        <th>สถานะ</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody id="orderTable"></tbody>
  </table>
</div>

<!-- 🔔 SOUND -->
<audio id="notifySound">
  <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">
</audio>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* 🔥 FIREBASE CONFIG */
firebase.initializeApp({
  apiKey: "AIzaSyC03JcyEyEg4iWVKMfgcpDR82EUiFOXMd4",
  authDomain: "chivats-black-order.firebaseapp.com",
  projectId: "chivats-black-order",
});
const db = firebase.firestore();

/* 🔐 LOGIN */
function login(){
  const u=user.value;
  const p=pass.value;
  if(u==="admin" && p==="1234"){
    loginBox.style.display="none";
    adminPanel.style.display="block";
    listenOrders();
  }else{
    alert("รหัสไม่ถูกต้อง");
  }
}

/* 🔔 REALTIME ORDERS */
let firstLoad=true;
function listenOrders(){
  db.collection("orders").orderBy("createdAt","desc")
  .onSnapshot(snap=>{
    if(!firstLoad){
      document.getElementById("notifySound").play();
    }
    firstLoad=false;

    orderTable.innerHTML="";
    snap.forEach(doc=>{
      const o=doc.data();
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${new Date(o.createdAt.seconds*1000).toLocaleString()}</td>
        <td>${o.name}<br>${o.phone}</td>
        <td>${o.items.map(i=>i.name).join("<br>")}</td>
        <td>${o.total}฿</td>
        <td class="status ${o.status}">${o.status}</td>
        <td class="actions">
          <button onclick="accept('${doc.id}')">รับ</button>
          <button onclick="del('${doc.id}')">ลบ</button>
        </td>
      `;
      orderTable.appendChild(tr);
    });
  });
}

/* ACTIONS */
function accept(id){
  db.collection("orders").doc(id).update({status:"accepted"});
}
function del(id){
  if(confirm("ลบออเดอร์นี้?")){
    db.collection("orders").doc(id).delete();
  }
}
</script>

</body>
</html>
