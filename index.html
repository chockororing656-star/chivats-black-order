<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIVATS BLACK ORDER</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:sans-serif;
  background:#111;
  color:#fff;
}
.container{
  max-width:480px;
  margin:auto;
  padding:16px;
}
h1{
  text-align:center;
  color:#f5c04f;
  margin-bottom:12px;
}

/* MENU */
.menu button{
  width:100%;
  margin:6px 0;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#f5c04f;
  font-size:16px;
  font-weight:bold;
}

/* CARD */
.card{
  background:#1c1c1c;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

/* CART */
.total{
  font-size:18px;
  margin-top:8px;
}

/* PAYMENT (จัดระเบียบแล้ว) */
.payment{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.payment label{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:18px;
}
.payment input[type="radio"]{
  width:20px;
  height:20px;
  accent-color:#f5c04f;
}

/* BUTTON */
button#submitOrder{
  margin-top:18px;
  width:100%;
  padding:16px;
  font-size:18px;
  font-weight:bold;
  background:#f5c04f;
  border:none;
  border-radius:16px;
}
</style>
</head>

<body>
<div class="container">

<h1>🍢 CHIVATS BLACK</h1>

<!-- MENU -->
<div class="menu">
  <button onclick="addItem('เคบับไก่ L',69)">เคบับไก่ L +69</button>
  <button onclick="addItem('เคบับไก่ M',60)">เคบับไก่ M +60</button>
  <button onclick="addItem('เฟรนฟรายเขย่า L',45)">เฟรนฟรายเขย่า L +45</button>
  <button onclick="addItem('เฟรนฟรายเขย่า M',40)">เฟรนฟรายเขย่า M +40</button>
  <button onclick="addItem('ไก่ป๊อปเขย่า L',45)">ไก่ป๊อปเขย่า L +45</button>
  <button onclick="addItem('ไก่ป๊อปเขย่า M',40)">ไก่ป๊อปเขย่า M +40</button>
  <button onclick="addItem('เฟรนฟราย + ไก่ป๊อป',45)">เฟรนฟราย + ไก่ป๊อป +45</button>
</div>

<!-- CART -->
<div class="card">
  <div id="cartList">ยังไม่มีรายการ</div>
  <div class="total">💰 ยอดรวม: <span id="total">0</span> บาท</div>
</div>

<!-- CUSTOMER -->
<div class="card">
  <h3>ข้อมูลลูกค้า</h3>
  <input id="customerName" placeholder="ชื่อลูกค้า">
  <input id="customerPhone" placeholder="เบอร์โทร">
</div>

<!-- PAYMENT -->
<div class="card payment">
  <h3>วิธีชำระเงิน</h3>
  <label>
    <input type="radio" name="pay" value="เงินสด" checked>
    เงินสด
  </label>
  <label>
    <input type="radio" name="pay" value="PromptPay">
    PromptPay
  </label>
</div>

<button id="submitOrder">ส่งออเดอร์</button>

</div>

<script>
let cart=[];

function addItem(name,price){
  cart.push({name,price});
  renderCart();
}

function renderCart(){
  const list=document.getElementById("cartList");
  if(cart.length===0){
    list.innerText="ยังไม่มีรายการ";
  }else{
    list.innerHTML=cart.map(i=>`• ${i.name} ${i.price}฿`).join("<br>");
  }
  document.getElementById("total").innerText=
    cart.reduce((s,i)=>s+i.price,0);
}

document.getElementById("submitOrder").onclick=()=>{
  if(cart.length===0){
    alert("กรุณาเลือกเมนู");
    return;
  }
  alert("ส่งออเดอร์เรียบร้อย");
  cart=[];
  renderCart();
};
</script>

</body>
</html>
