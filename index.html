<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIVATS BLACK ORDER</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
.container{max-width:480px;margin:auto;padding:16px}
.admin{max-width:1200px}
h1,h2{text-align:center;color:#f5c04f}
.hidden{display:none}
.card{background:#1c1c1c;border-radius:14px;padding:14px;margin-top:14px}
button{border:none;border-radius:14px;background:#f5c04f;font-weight:bold;cursor:pointer;padding:10px 14px}
.menu button{width:100%;margin:6px 0;padding:14px;font-size:16px}
input{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:none;font-size:16px}
.payment{display:flex;flex-direction:column;gap:12px}
.payment label{display:flex;align-items:center;gap:12px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1}
.tabs .active{background:#ff9800}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid #333;padding:8px;font-size:14px}
</style>
</head>

<body>

<!-- CUSTOMER -->
<div class="container" id="customerPage">
<h1>🍢 CHIVATS BLACK</h1>

<div class="menu">
<button onclick="addItem('เคบับไก่ L',69)">เคบับไก่ L +69</button>
<button onclick="addItem('เคบับไก่ M',60)">เคบับไก่ M +60</button>
<button onclick="addItem('เฟรนฟรายเขย่า L',45)">เฟรนฟรายเขย่า L +45</button>
<button onclick="addItem('เฟรนฟรายเขย่า M',40)">เฟรนฟรายเขย่า M +40</button>
<button onclick="addItem('ไก่ป๊อปเขย่า L',45)">ไก่ป๊อปเขย่า L +45</button>
<button onclick="addItem('ไก่ป๊อปเขย่า M',40)">ไก่ป๊อปเขย่า M +40</button>
<button onclick="addItem('เฟรนฟราย + ไก่ป๊อป',45)">เฟรนฟราย + ไก่ป๊อป +45</button>
</div>

<div class="card">
<div id="cartList">ยังไม่มีรายการ</div>
<div>💰 รวม: <span id="total">0</span> บาท</div>
</div>

<div class="card">
<input id="cName" placeholder="ชื่อลูกค้า">
<input id="cPhone" placeholder="เบอร์โทร">
</div>

<div class="card payment">
<label><input type="radio" name="pay" value="เงินสด" checked> เงินสด</label>
<label><input type="radio" name="pay" value="PromptPay"> PromptPay</label>
</div>

<button id="submitOrder">ส่งออเดอร์</button>
</div>

<!-- ADMIN -->
<div class="container admin hidden" id="adminPage">
<h1>📦 ADMIN</h1>

<div class="card">
📊 วันนี้: <b><span id="orderCount">0</span></b> ออเดอร์ |
💰 รวม <b><span id="dailyTotal">0</span></b> บาท
</div>

<table>
<thead>
<tr><th>วัน</th><th>ลูกค้า</th><th>ยอด</th></tr>
</thead>
<tbody id="orders"></tbody>
</table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyC03JcyEyEg4iWVKMfgcpDR82EUiFOXMd4",
 authDomain:"chivats-black-order.firebaseapp.com",
 projectId:"chivats-black-order"
});
const db=firebase.firestore();

/* CUSTOMER */
let cart=[];
function addItem(n,p){cart.push({name:n,price:p});render()}
function render(){
 cartList.innerHTML=cart.length?cart.map(i=>`• ${i.name} ${i.price}฿`).join("<br>"):"ยังไม่มีรายการ";
 total.innerText=cart.reduce((s,i)=>s+i.price,0);
}

submitOrder.onclick=()=>{
 if(!cart.length) return alert("เลือกเมนูก่อน");
 const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD

 db.collection("orders").add({
  day: today,                     // 🔥 สำคัญที่สุด
  name: cName.value || "-",
  phone: cPhone.value || "-",
  items: cart,
  total: cart.reduce((s,i)=>s+i.price,0),
  status: "new",
  createdAt: new Date()
 });

 cart=[]; render();
 alert("ส่งออเดอร์เรียบร้อย");
};

/* ADMIN */
const today = new Date().toISOString().slice(0,10);
db.collection("orders").where("day","==",today)
.onSnapshot(snap=>{
 let sum=0,count=0;
 orders.innerHTML="";
 snap.forEach(d=>{
  const o=d.data();
  count++;
  sum+=o.total;
  orders.innerHTML+=`
<tr>
<td>${o.day}</td>
<td>${o.name}</td>
<td>${o.total}฿</td>
</tr>`;
 });
 orderCount.innerText=count;
 dailyTotal.innerText=sum;
});

adminPage.classList.remove("hidden"); // เปิดหน้าแอดมินตรง ๆ
</script>

</body>
</html>
