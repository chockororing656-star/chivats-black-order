<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIVATS BLACK ORDER</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
h1,h2{text-align:center;color:#f5c04f}
.container{max-width:480px;margin:auto;padding:16px}
.admin{max-width:1200px}
.hidden{display:none}
.card{background:#1c1c1c;border-radius:14px;padding:14px;margin-top:14px}
button{background:#f5c04f;border:none;border-radius:12px;padding:12px;font-weight:bold;cursor:pointer}
.menu button{width:100%;margin:6px 0}
input{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:none}
.payment{display:flex;flex-direction:column;gap:10px}
.payment label{display:flex;align-items:center;gap:10px}
.payment input{accent-color:#f5c04f}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1}
.tabs .active{background:#ff9800}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid #333;padding:8px;font-size:14px}
@media(max-width:768px){
 table,thead,tbody,tr,td,th{display:block}
 th{display:none}
 tr{background:#1c1c1c;border-radius:12px;padding:12px;margin-bottom:12px}
}
</style>
</head>

<body>

<!-- CUSTOMER -->
<div class="container" id="customer">
<h1>🍢 CHIVATS BLACK</h1>

<div class="menu">
<button onclick="addItem('เคบับไก่ L',69)">เคบับไก่ L +69</button>
<button onclick="addItem('เคบับไก่ M',60)">เคบับไก่ M +60</button>
<button onclick="addItem('เฟรนฟรายเขย่า L',45)">เฟรนฟรายเขย่า L +45</button>
<button onclick="addItem('เฟรนฟรายเขย่า M',40)">เฟรนฟรายเขย่า M +40</button>
<button onclick="addItem('ไก่ป๊อปเขย่า L',45)">ไก่ป๊อปเขย่า L +45</button>
<button onclick="addItem('ไก่ป๊อปเขย่า M',40)">ไก่ป๊อปเขย่า M +40</button>
<button onclick="addItem('เฟรนฟราย + ไก่ป๊อป',45)">เฟรนฟราย + ไก่ป๊อป +45</button>
</div>

<div class="card">
<div id="cart">ยังไม่มีรายการ</div>
<div>รวม <span id="total">0</span> บาท</div>
</div>

<div class="card">
<input id="name" placeholder="ชื่อลูกค้า">
<input id="phone" placeholder="เบอร์โทร">
</div>

<div class="card payment">
<label><input type="radio" name="pay" value="เงินสด" checked> เงินสด</label>
<label><input type="radio" name="pay" value="PromptPay"> PromptPay</label>
</div>

<button onclick="submitOrder()">ส่งออเดอร์</button>
</div>

<!-- ADMIN LOGIN -->
<div class="container hidden" id="login">
<h2>Admin Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">เข้าสู่ระบบ</button>
</div>

<!-- ADMIN -->
<div class="container admin hidden" id="admin">
<h1>📦 ADMIN</h1>

<div class="tabs">
<button class="active" onclick="setTab('new')">ใหม่</button>
<button onclick="setTab('working')">กำลังทำ</button>
<button onclick="setTab('done')">เสร็จแล้ว</button>
</div>

<table>
<thead>
<tr><th>คิว</th><th>ลูกค้า</th><th>รายการ</th><th>ยอด</th><th>จัดการ</th></tr>
</thead>
<tbody id="orders"></tbody>
</table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyC03JcyEyEg4iWVKMfgcpDR82EUiFOXMd4",
 authDomain:"chivats-black-order.firebaseapp.com",
 projectId:"chivats-black-order"
});
const db=firebase.firestore();

/* CUSTOMER */
let cart=[];
function addItem(n,p){cart.push({n,p});render()}
function render(){
 cart.innerHTML="";
 document.getElementById("cart").innerHTML=cart.length?
 cart.map(i=>`• ${i.n} ${i.p}฿`).join("<br>"):"ยังไม่มีรายการ";
 document.getElementById("total").innerText=cart.reduce((s,i)=>s+i.p,0);
}
async function submitOrder(){
 if(!cart.length)return alert("เลือกเมนูก่อน");
 const today=new Date().toDateString();
 const q=(await db.collection("orders").where("day","==",today).get()).size+1;
 await db.collection("orders").add({
  day:today,
  queue:q,
  name:name.value||"-",
  phone:phone.value||"-",
  items:cart,
  total:cart.reduce((s,i)=>s+i.p,0),
  status:"new",
  createdAt:new Date()
 });
 cart=[];render();
 alert("คิวของคุณคือ "+q);
}

/* ADMIN */
let tab="new";
if(location.hash==="#admin"){
 customer.classList.add("hidden");
 login.classList.remove("hidden");
}
function login(){
 if(user.value==="admin"&&pass.value==="1234"){
  login.classList.add("hidden");
  admin.classList.remove("hidden");
  listen();
 }else alert("รหัสผิด");
}
function setTab(t){
 tab=t;
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
 event.target.classList.add("active");
 listen();
}
function listen(){
 db.collection("orders").orderBy("createdAt","desc")
 .onSnapshot(s=>{
  orders.innerHTML="";
  s.forEach(d=>{
   const o=d.data();
   if(o.status!==tab)return;
   orders.innerHTML+=`
<tr>
<td>#${o.queue}</td>
<td>${o.name}</td>
<td>${o.items.map(i=>i.n).join("<br>")}</td>
<td>${o.total}฿</td>
<td>
${o.status==="new"?`<button onclick="upd('${d.id}','working')">รับ</button>`:""}
${o.status==="working"?`<button onclick="upd('${d.id}','done')">เสร็จ</button>`:""}
<button onclick="del('${d.id}')">ลบ</button>
</td>
</tr>`;
  });
 });
}
function upd(id,s){db.collection("orders").doc(id).update({status:s})}
function del(id){if(confirm("ลบออเดอร์?"))db.collection("orders").doc(id).delete()}
</script>

</body>
</html>
