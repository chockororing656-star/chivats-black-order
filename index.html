<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIVATS BLACK ORDER</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
.container{max-width:480px;margin:auto;padding:16px}
.admin{max-width:1200px}
h1,h2{text-align:center;color:#f5c04f}
.hidden{display:none}

/* CARD */
.card{background:#1c1c1c;border-radius:14px;padding:14px;margin-top:14px}
button{border:none;border-radius:14px;background:#f5c04f;font-weight:bold;cursor:pointer;padding:10px 14px}

/* CUSTOMER */
.menu button{width:100%;margin:6px 0;padding:14px;font-size:16px}
input{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:none;font-size:16px}
.payment{display:flex;flex-direction:column;gap:12px}
.payment label{display:flex;align-items:center;gap:12px;font-size:16px}
.payment input{width:18px;height:18px;accent-color:#f5c04f}
#submitOrder{width:100%;padding:16px;font-size:18px;margin-top:16px}

/* ADMIN */
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1}
.tabs .active{background:#ff9800}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid #333;padding:8px;font-size:14px}
.timer.green{color:#4caf50}
.timer.orange{color:#ffc107}
.timer.red{color:#ff5252}

/* MOBILE */
@media(max-width:768px){
 table,thead,tbody,tr,td,th{display:block}
 th{display:none}
 tr{background:#1c1c1c;border-radius:12px;padding:12px;margin-bottom:12px}
}
</style>
</head>

<body>

<!-- ================= CUSTOMER ================= -->
<div class="container" id="customerPage">
<h1>🍢 CHIVATS BLACK</h1>

<div class="menu">
<button onclick="addItem('เคบับไก่ L',69)">เคบับไก่ L +69</button>
<button onclick="addItem('เคบับไก่ M',60)">เคบับไก่ M +60</button>
<button onclick="addItem('เฟรนฟรายเขย่า L',45)">เฟรนฟรายเขย่า L +45</button>
<button onclick="addItem('เฟรนฟรายเขย่า M',40)">เฟรนฟรายเขย่า M +40</button>
<button onclick="addItem('ไก่ป๊อปเขย่า L',45)">ไก่ป๊อปเขย่า L +45</button>
<button onclick="addItem('ไก่ป๊อปเขย่า M',40)">ไก่ป๊อปเขย่า M +40</button>
<button onclick="addItem('เฟรนฟราย + ไก่ป๊อป',45)">เฟรนฟราย + ไก่ป๊อป +45</button>
</div>

<div class="card">
<div id="cartList">ยังไม่มีรายการ</div>
<div>💰 รวม: <span id="total">0</span> บาท</div>
</div>

<div class="card">
<input id="cName" placeholder="ชื่อลูกค้า">
<input id="cPhone" placeholder="เบอร์โทร">
</div>

<div class="card payment">
<label><input type="radio" name="pay" value="เงินสด" checked> เงินสด</label>
<label><input type="radio" name="pay" value="PromptPay"> PromptPay</label>
</div>

<button id="submitOrder">ส่งออเดอร์</button>
</div>

<!-- ================= ADMIN LOGIN ================= -->
<div class="container hidden" id="adminLogin">
<h2>🔐 Admin Login</h2>
<input id="adminUser" placeholder="Username">
<input id="adminPass" type="password" placeholder="Password">
<button onclick="login()">เข้าสู่ระบบ</button>
</div>

<!-- ================= ADMIN PANEL ================= -->
<div class="container admin hidden" id="adminPage">
<h1>📦 ADMIN – CHIVATS BLACK</h1>

<!-- SUMMARY -->
<div class="card">
📊 วันนี้: <b><span id="orderCount">0</span></b> ออเดอร์ |
💰 รวม <b><span id="dailyTotal">0</span></b> บาท
</div>

<div class="tabs">
<button class="active" onclick="setTab('new')">ออเดอร์ใหม่</button>
<button onclick="setTab('working')">กำลังทำ</button>
<button onclick="setTab('done')">เสร็จแล้ว</button>
</div>

<table>
<thead>
<tr>
<th>เวลา</th>
<th>จับเวลา</th>
<th>ลูกค้า</th>
<th>รายการ</th>
<th>ยอด</th>
<th>จัดการ</th>
</tr>
</thead>
<tbody id="orders"></tbody>
</table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
 apiKey:"AIzaSyC03JcyEyEg4iWVKMfgcpDR82EUiFOXMd4",
 authDomain:"chivats-black-order.firebaseapp.com",
 projectId:"chivats-black-order"
});
const db=firebase.firestore();

/* ================= CUSTOMER ================= */
let cart=[];
function addItem(n,p){cart.push({name:n,price:p});render()}
function render(){
 cartList.innerHTML=cart.length
 ? cart.map(i=>`• ${i.name} ${i.price}฿`).join("<br>")
 : "ยังไม่มีรายการ";
 total.innerText=cart.reduce((s,i)=>s+i.price,0);
}
submitOrder.onclick=()=>{
 if(!cart.length) return alert("เลือกเมนูก่อน");
 db.collection("orders").add({
  name:cName.value||"-",
  phone:cPhone.value||"-",
  payment:document.querySelector('[name=pay]:checked').value,
  items:cart,
  total:cart.reduce((s,i)=>s+i.price,0),
  status:"new",
  createdAt:new Date()
 });
 cart=[];render();
 alert("ส่งออเดอร์เรียบร้อย");
};

/* ================= ADMIN ================= */
let tab="new";
if(location.hash==="#admin"){
 customerPage.classList.add("hidden");
 adminLogin.classList.remove("hidden");
}

function login(){
 if(adminUser.value==="admin" && adminPass.value==="1234"){
  adminLogin.classList.add("hidden");
  adminPage.classList.remove("hidden");
  listen();
 }else alert("รหัสไม่ถูกต้อง");
}

function setTab(t){
 tab=t;
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
 event.target.classList.add("active");
 listen();
}

function listen(){
 const today = new Date().toDateString();
 db.collection("orders").orderBy("createdAt","desc")
 .onSnapshot(snap=>{
  orders.innerHTML="";
  let sum=0,count=0;

  snap.forEach(d=>{
   const o=d.data();

   if(o.createdAt && o.createdAt.toDate().toDateString()===today){
    count++; sum+=o.total;
   }

   if(o.status!==tab) return;

   const sec=Math.floor((Date.now()-o.createdAt.toDate())/1000);
   const min=Math.floor(sec/60);
   const s2=sec%60;
   let c="green"; if(min>=5)c="orange"; if(min>=10)c="red";

   orders.innerHTML+=`
<tr>
<td>${o.createdAt.toDate().toLocaleString()}</td>
<td class="timer ${c}">${min}:${s2.toString().padStart(2,"0")}</td>
<td>${o.name}<br>${o.phone}</td>
<td>${o.items.map(i=>i.name).join("<br>")}</td>
<td>${o.total}฿</td>
<td>
${o.status==="new"?`<button onclick="upd('${d.id}','working')">รับ</button>`:""}
${o.status==="working"?`<button onclick="upd('${d.id}','done')">เสร็จ</button>`:""}
<button onclick="del('${d.id}')">ลบ</button>
</td>
</tr>`;
  });

  orderCount.innerText=count;
  dailyTotal.innerText=sum;
 });
}

function upd(id,s){db.collection("orders").doc(id).update({status:s})}
function del(id){if(confirm("ลบออเดอร์?")) db.collection("orders").doc(id).delete()}
</script>

</body>
</html>
