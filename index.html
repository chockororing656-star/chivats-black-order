<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIVATS BLACK ORDER</title>

<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
.container{max-width:480px;margin:auto;padding:16px}
h1{text-align:center;color:#f5c04f}
.menu button{width:100%;margin:6px 0;padding:14px;border:none;border-radius:10px;background:#f5c04f;font-size:16px}
.card{background:#1c1c1c;border-radius:10px;padding:12px;margin-top:12px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px}
.total{font-size:18px;margin-top:8px}
button#submitOrder{margin-top:14px;width:100%;padding:16px;font-size:18px;background:#f5c04f;border:none;border-radius:12px}
</style>
</head>

<body>
<div class="container">

<h1>🍢 CHIVATS BLACK</h1>

<div class="menu">
  <button onclick="addItem('เคบับไก่ L',69)">เคบับไก่ L +69</button>
  <button onclick="addItem('เคบับไก่ M',60)">เคบับไก่ M +60</button>
  <button onclick="addItem('เฟรนฟรายเขย่า L',45)">เฟรนฟรายเขย่า L +45</button>
  <button onclick="addItem('เฟรนฟรายเขย่า M',40)">เฟรนฟรายเขย่า M +40</button>
  <button onclick="addItem('ไก่ป๊อปเขย่า L',45)">ไก่ป๊อปเขย่า L +45</button>
  <button onclick="addItem('ไก่ป๊อปเขย่า M',40)">ไก่ป๊อปเขย่า M +40</button>
  <button onclick="addItem('เฟรนฟราย + ไก่ป๊อป',45)">เฟรนฟราย + ไก่ป๊อป +45</button>
</div>

<div class="card">
  <div id="cartList">ยังไม่มีรายการ</div>
  <div class="total">💰 ยอดรวม: <span id="total">0</span> บาท</div>
</div>

<div class="card">
  <input id="customerName" placeholder="ชื่อลูกค้า">
  <input id="customerPhone" placeholder="เบอร์โทร">
</div>

<div class="card">
  <label><input type="radio" name="pay" value="เงินสด" checked> เงินสด</label>
  <label><input type="radio" name="pay" value="PromptPay"> PromptPay</label>
</div>

<button id="submitOrder">ส่งออเดอร์</button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey: "AIzaSyC03JcyEyEg4iWVKMfgcpDR82EUiFOXMd4",
  authDomain: "chivats-black-order.firebaseapp.com",
  projectId: "chivats-black-order"
});
const db = firebase.firestore();

/* ===== TELEGRAM ===== */
const BOT_TOKEN = "8529657624:AAHeinqknXFiKrgyuyOz7h-GCbPUVoHWf3Q";
const CHAT_ID  = "566507150";

/* ===== DATA ===== */
let cart = [];

function addItem(name, price){
  cart.push({name, price});
  renderCart();
}

function renderCart(){
  document.getElementById("cartList").innerHTML =
    cart.length ? cart.map(i=>`• ${i.name} ${i.price}฿`).join("<br>") : "ยังไม่มีรายการ";
  document.getElementById("total").innerText =
    cart.reduce((s,i)=>s+i.price,0);
}

document.getElementById("submitOrder").onclick = async ()=>{
  if(!cart.length) return alert("กรุณาเลือกเมนู");

  const name = customerName.value || "-";
  const phone = customerPhone.value || "-";
  const payment = document.querySelector('input[name="pay"]:checked').value;
  const total = cart.reduce((s,i)=>s+i.price,0);

  const order = {
    name, phone, payment,
    items: cart,
    total,
    status: "new",
    createdAt: new Date()
  };

  await db.collection("orders").add(order);

  const text =
`🛎 ออเดอร์ใหม่ CHIVATS BLACK
👤 ${name}
📞 ${phone}
💳 ${payment}
💰 รวม ${total} บาท

${cart.map(i=>`• ${i.name} ${i.price}฿`).join("\n")}`;

  const body = new URLSearchParams({
    chat_id: CHAT_ID,
    text: text
  });

  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body: body
  });

  alert("ส่งออเดอร์เรียบร้อย");
  cart=[]; renderCart();
};
</script>
</body>
</html>
